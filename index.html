<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Painel de Tarefas</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Foto de fundo -->
    <div class="foto-container">
        <img src="image.png" alt="Foto do meu cachorro">
    </div>

    <!-- Painel principal -->
    <div class="cartao-aplicacao">

        <header class="cabecalho-aplicacao">
            <h1>Minhas Tarefas</h1>

            <button id="botao-tema" class="botao-icone">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>

        <!-- Campo para adicionar tarefa -->
        <div class="caixa-entrada">

            <input
                type="text"
                id="campo-tarefa"
                placeholder="O que vamos fazer hoje?"
            >

            <button id="botao-adicionar" class="botao-principal">
                <i class="fa-solid fa-plus"></i>
                Adicionar
            </button>

        </div>

        <!-- Lista de tarefas -->
        <ul id="lista-tarefas" class="lista-tarefas"></ul>

        <!-- Rodapé -->
        <footer class="rodape-aplicacao">
            <span id="contador-tarefas">
                0 tarefas na lista
            </span>
        </footer>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
